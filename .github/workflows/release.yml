name: release

# Push a tag like v0.1.0 to build binaries for Linux, macOS and Windows and
# attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-13, target: x86_64-apple-darwin, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p oxgraft --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          name="oxgraft-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          bin="target/${{ matrix.target }}/release/oxgraft"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" README.md LICENSE NOTICE "$name/"
          if [ "${{ matrix.archive }}" = zip ]; then 7z a "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name"; fi
          echo "ASSET=$name.${{ matrix.archive }}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
