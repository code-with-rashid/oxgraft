# Harnesses Oxgraft watches and learns from. One [[harness]] per project.
#
# policy:
#   adapt       permissive license (MIT/Apache-2.0): code may be adapted with
#               attribution in NOTICE and provenance on the strategy
#   clean-room  source-available or unclear license: learn from behaviour and
#               docs only; never copy source
#   reference   closed source: public docs, changelogs and observed behaviour only
#
# last_reviewed: the upstream release tag (or commit) whose changes are fully
# reflected in learning/harnesses/<id>.md. Empty = never reviewed.
# scripts/watch-harnesses.mjs compares this with upstream and reports drift.
# Licenses verified via the GitHub API on 2026-11-24; re-check on each review.

[[harness]]
id = "codex"
name = "OpenAI Codex CLI"
repo = "openai/codex"
license = "Apache-2.0"
language = "Rust"
policy = "adapt"
last_reviewed = "rust-v0.172.0"
focus = ["sandbox", "approval", "edit_format"]

