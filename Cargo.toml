[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/code-with-rashid/oxgraft"
homepage = "https://github.com/code-with-rashid/oxgraft"
authors = ["Rashid Mahmood"]

[workspace.dependencies]
oxgraft-protocol = { path = "crates/oxgraft-protocol", version = "0.0.1" }
oxgraft-seams = { path = "crates/oxgraft-seams", version = "0.0.1" }
oxgraft-strategies = { path = "crates/oxgraft-strategies", version = "0.0.1" }
oxgraft-core = { path = "crates/oxgraft-core", version = "0.0.1" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
