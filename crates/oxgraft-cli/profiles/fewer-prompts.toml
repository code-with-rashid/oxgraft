# Default strategies, but single read-only shell commands (ls, cat, wc,
# grep, …) run without asking (GRAFT-0047, after Crush). Trial: not the default
# until an evaluation shows it costs nothing in safety.
name = "fewer-prompts"
description = "ordered_rules plus auto-allow for inert read-only shell commands."

[strategies]
edit_format = "search_replace"
context = "pinned_then_in_order"
approval = "inert_reads"
sandbox = "none"
